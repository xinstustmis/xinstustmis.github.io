<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />

    <link href="BlazorApp2.styles.css" rel="stylesheet" />

    <link rel="apple-touch-icon" sizes="192x192" href="icon100_v192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon100_v512.png" />
    <meta name="apple-mobile-web-app-title" content="高中職落點分析網" />

</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.toggleDarkModeClass = function (enable) {
            if (enable) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }
    </script>
    <!-- importantdate頁面 -->
    <script>
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("此瀏覽器不支援通知功能");
                return;
            }

            Notification.requestPermission().then(function (permission) {
                if (permission === "granted") {
                    new Notification("✅ 通知已啟用，提醒事項將會出現在您的裝置上！");
                } else {
                    alert("您未授權通知功能。");
                }
            });
        }
    </script>
    <!-- 公告輪播 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 

</body>

</html>
